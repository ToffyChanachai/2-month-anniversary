<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b1a1a">
  <title>Jigsaw Board</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="toolbar">
    <h1>กระดานจิ๊กซอว์</h1>
    <button id="shuffle" class="primary">🔄 รีเซ็ต</button>
    <div class="stats">
      <span id="count">0/0</span>
    </div>
  </div>

  <div id="stage">
    <div id="board"><canvas id="hint"></canvas></div>
  </div>

  <div id="reward">
    <div class="hearts" id="hearts"></div>
    <div class="gift" id="gift">
      <div class="gift-body"></div>
      <div class="gift-lid"><span class="bow">🎀</span></div>
    </div>
    <div class="letter-wrap" id="letterWrap">
      <div class="scroll">
        <div class="paper">
          <div class="content">
            <h2 class="r-title"></h2>
            <div class="r-gallery">
              <div class="r-track"></div>
              <button class="r-nav prev" aria-label="รูปก่อนหน้า">‹</button>
              <button class="r-nav next" aria-label="รูปถัดไป">›</button>
              <div class="r-dots"></div>
            </div>
            <p class="r-msg"></p>
            <button class="again">ปิด</button>
          </div>
        </div>
        <div class="rod rod-top"></div>
        <div class="roll">
          <div class="rod"></div>
          <div class="roll-paper"></div>
        </div>
        <div class="tie">
          <div class="seal">♥</div>
        </div>
      </div>
    </div>
    <div class="tap-hint">👆 แตะเพื่อเปิด</div>
    <canvas id="confetti"></canvas>
  </div>

  <script src="script.js"></script>
</body>

</html>
